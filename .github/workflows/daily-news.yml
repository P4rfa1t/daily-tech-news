name: 每日科技新闻

on:
  schedule:
    # GitHub Actions 用 UTC。北京时间每天 08:00 = UTC 00:00。
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: '忽略「今天已发送」限制，强制再发一次'
        type: boolean
        default: false

# 同一时刻只跑一个实例（手动触发时如果定时任务已在跑，新的直接排队取消）
concurrency:
  group: daily-tech-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 以前这里用 actions/cache 存翻译缓存与去重状态，但 GitHub 的
      # cache 连续 7 天没命中就过期删除。翻译缓存一丢，每天 ~95 段全部
      # 重新请求翻译接口；star 快照一丢，增速榜退回"新建 N 天"排序；
      # send_state 一丢，"今天已发送"状态消失，手动触发会重复发信。
      # 现在这些文件都放在 cache/ 目录，由最后一步 commit 回仓库，永久保留。

      - name: 跑单元测试
        run: python -m unittest test_news_collector -q

      - name: 执行收集并发送
        env:
          # 容器默认 TZ=UTC；程序按 settings.timezone=Asia/Shanghai 判断
          # "今天是哪天"和"是否过发送时间"。显式声明只是双保险。
          TZ: Asia/Shanghai
          # 密钥从仓库 Secrets 注入，写进环境变量，不落 config.json
          SMTP_SENDER: ${{ secrets.SMTP_SENDER }}
          SMTP_RECIPIENTS: ${{ secrets.SMTP_RECIPIENTS }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # GITHUB_TOKEN 由 Actions 自动注入（secrets.GITHUB_TOKEN），无需手填。
          # 注意：GitHub 禁止创建以 GITHUB_ 开头的自定义 Secret，这里不覆盖它。
          VOLC_ACCESS_KEY: ${{ secrets.VOLC_ACCESS_KEY }}
          VOLC_SECRET_KEY: ${{ secrets.VOLC_SECRET_KEY }}
          VOLC_REGION: ${{ secrets.VOLC_REGION }}
          # 经环境变量传递而非直接插值到 shell，避免 ${{ }} 内容被当成脚本解析。
          # 定时触发时 inputs.force 为空，等同 false。
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            echo "强制发送已开启：忽略「今天已发送」与发送时间限制。"
            python news_collector.py --force
          else
            python news_collector.py
          fi

      - name: 打印本次摘要
        if: always()
        env:
          FORCE: ${{ inputs.force }}
        run: |
          {
            echo "### 本次运行"
            echo "- UTC：$(date -u '+%Y-%m-%d %H:%M')　北京时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')"
            if [ "$FORCE" = "true" ]; then
              echo "- 触发方式：手动 + **强制发送**"
            else
              echo "- 触发方式：${{ github.event_name }}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f cache/send_state.json ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat cache/send_state.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传日志与存档
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-${{ github.run_number }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            news_collector.log
            history/*.txt
            history/*.html
            cache/translation_cache.json
            cache/github_stars.json
            cache/github_descriptions.json
            cache/send_state.json

      - name: 提交当日存档与缓存回仓库
        if: success()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "存档 ${{ github.run_number }} 期的日报"
          file_pattern: |
            history/*
            cache/*
          branch: ${{ github.ref_name }}